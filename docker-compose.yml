# ============================================================
# Pharmacy ERP — Production Docker Compose
# Uses the official all-in-one image from Docker Hub
# ============================================================
# Usage:
#   docker compose up -d
# ============================================================

services:
  pharmacy-erp:
    image: omersx/pharmacy-erp:latest
    container_name: pharmacy-erp
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - backend_data:/app/backend/data

volumes:
  backend_data:
    driver: local
